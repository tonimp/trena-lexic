<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  :root { --bg: #faf3e8; --fg: #2b2118; --muted: #6b5a4a; --accent: #b84a32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1814; --fg: #f3ebe0; --muted: #b8a898; --accent: #e9805f; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1, h2 { line-height: 1.25; }
  a { color: var(--accent); }
  nav { font-size: 15px; color: var(--muted); margin-bottom: 24px; }
  nav a { margin-right: 16px; }
  footer { margin-top: 48px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
<nav><a href="{{ '/' | relative_url }}">Suport</a><a href="{{ '/privadesa/' | relative_url }}">Privadesa</a></nav>
{{ content }}
<footer>Trena · joc de mots encreuats en català</footer>
</main>
</body>
</html>
